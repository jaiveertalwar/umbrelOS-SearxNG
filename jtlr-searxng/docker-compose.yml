version: "3.7"

services:
  app_proxy:
    image: getumbrel/nginx-proxy-manager:latest
    environment:
      APP_HOST: searxng
      APP_PORT: 8080
    restart: always

  searxng:
    image: searxng/searxng:latest
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BASE_URL: http://localhost:8080/
    ports:
      - "8080:8080"
